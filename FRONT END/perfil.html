<!DOCTYPE html>
<html lang="es">
<head>
    <title>Mi Perfil</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
        }

        .navbar-brand {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 1.8rem;
            margin-right: 2rem;
        }

        .navbar-nav .nav-link {
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
        }

        .btn-logout {
            background-color: transparent;
            border: 2px solid white;
            color: white;
            border-radius: 30px;
            padding: 8px 20px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn-logout:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: white;
            color: white;
            transform: translateY(-2px);
        }

        .section-title {
            position: relative;
            margin-bottom: 2rem;
            text-align: center;
        }

        .section-title::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(to right, #4A90E2, #FF6B6B);
            border-radius: 2px;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            margin-bottom: 2rem;
        }

        .card-header {
            background: linear-gradient(135deg, #4A90E2, #6B48FF);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 1.5rem;
        }

        .card-header h5 {
            margin: 0;
            font-weight: 600;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #4A90E2;
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
        }

        .form-label {
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4A90E2, #6B48FF);
            border: none;
            border-radius: 30px;
            padding: 12px 30px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #FF6B6B, #FF5252);
            border: none;
            border-radius: 30px;
            padding: 12px 30px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            border: none;
            border-radius: 30px;
            padding: 12px 30px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .profile-header {
            background: linear-gradient(135deg, #4A90E2, #6B48FF);
            color: white;
            padding: 3rem 0;
            margin-bottom: 2rem;
            border-radius: 0 0 15px 15px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .profile-info h2 {
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .profile-info p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .custom-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            min-width: 300px;
            background-color: #06D6A0;
            color: white;
            border-radius: 10px;
            padding: 15px 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideInRight 0.5s ease-out;
        }

        .custom-notification.error {
            background-color: #FF6B6B;
        }

        .custom-notification.info {
            background-color: #4A90E2;
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .sidebar-nav {
            list-style: none;
            padding: 0;
        }

        .sidebar-nav li {
            margin-bottom: 0.5rem;
        }

        .sidebar-nav a {
            display: block;
            padding: 12px 15px;
            color: #2c3e50;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        .sidebar-nav a:hover {
            background-color: #e9ecef;
            border-left-color: #4A90E2;
            padding-left: 18px;
        }

        .sidebar-nav a.active {
            background-color: #e8f0fe;
            color: #4A90E2;
            border-left-color: #4A90E2;
            padding-left: 18px;
            font-weight: 600;
        }

        .modal-content {
            border-radius: 15px;
            border: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-header {
            background: linear-gradient(135deg, #4A90E2, #6B48FF);
            color: white;
            border-radius: 15px 15px 0 0;
            border: none;
        }

        .modal-header .btn-close {
            filter: invert(1);
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Frío Natural</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="catalogo.html">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="perfil.html">Mi Perfil</a>
                    </li>
                </ul>
                
                <div class="d-flex align-items-center">
                    <button class="btn-logout" id="logoutBtn">Cerrar Sesión</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Profile Header -->
    <div class="profile-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-3 text-center">
                    <div class="profile-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
                <div class="col-md-9">
                    <div class="profile-info">
                        <h2 id="userName">Cargando...</h2>
                        <p id="userEmail">email@example.com</p>
                        <p id="userRole">Usuario</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mb-5">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 mb-4">
                <div class="card">
                    <div class="card-body p-0">
                        <ul class="sidebar-nav">
                            <li><a href="#" class="nav-item active" onclick="showSection('perfil', event)"><i class="fas fa-user me-2"></i>Mi Información</a></li>
                            <li><a href="#" class="nav-item" onclick="showSection('contraseña', event)"><i class="fas fa-lock me-2"></i>Cambiar Contraseña</a></li>
                            <li><a href="#" class="nav-item" onclick="showSection('eliminar', event)"><i class="fas fa-trash me-2"></i>Eliminar Cuenta</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="col-md-9">
                <!-- Mi Información -->
                <div id="perfil-section" class="content-section">
                    <div class="card">
                        <div class="card-header">
                            <h5><i class="fas fa-user me-2"></i>Mi Información</h5>
                        </div>
                        <div class="card-body">
                            <form id="profileForm">
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="fullName" class="form-label">Nombre Completo</label>
                                        <input type="text" class="form-control" id="fullName" placeholder="Tu nombre completo">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="userEmailDisplay" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="userEmailDisplay" disabled>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="userRoleDisplay" class="form-label">Rol</label>
                                        <input type="text" class="form-control" id="userRoleDisplay" disabled>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="joinDate" class="form-label">Miembro desde</label>
                                        <input type="text" class="form-control" id="joinDate" disabled>
                                    </div>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save me-2"></i>Guardar Cambios
                                    </button>
                                    <button type="reset" class="btn btn-secondary">
                                        <i class="fas fa-undo me-2"></i>Cancelar
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Cambiar Contraseña -->
                <div id="contraseña-section" class="content-section d-none">
                    <div class="card">
                        <div class="card-header">
                            <h5><i class="fas fa-lock me-2"></i>Cambiar Contraseña</h5>
                        </div>
                        <div class="card-body">
                            <form id="passwordForm">
                                <div class="mb-3">
                                    <label for="oldPassword" class="form-label">Contraseña Actual</label>
                                    <input type="password" class="form-control" id="oldPassword" placeholder="Tu contraseña actual" required>
                                </div>

                                <div class="mb-3">
                                    <label for="newPassword" class="form-label">Nueva Contraseña</label>
                                    <input type="password" class="form-control" id="newPassword" placeholder="Tu nueva contraseña" required>
                                </div>

                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label">Confirmar Nueva Contraseña</label>
                                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirma tu nueva contraseña" required>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save me-2"></i>Cambiar Contraseña
                                    </button>
                                    <button type="reset" class="btn btn-secondary">
                                        <i class="fas fa-undo me-2"></i>Cancelar
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Eliminar Cuenta -->
                <div id="eliminar-section" class="content-section d-none">
                    <div class="card">
                        <div class="card-header">
                            <h5><i class="fas fa-trash me-2"></i>Eliminar Cuenta</h5>
                        </div>
                        <div class="card-body">
                            <div class="alert alert-danger" role="alert">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                <strong>¡Atención!</strong> Esta acción es irreversible. Se eliminarán todos tus datos.
                            </div>

                            <form id="deleteForm">
                                <div class="mb-3">
                                    <label for="deletePassword" class="form-label">Ingresa tu contraseña para confirmar</label>
                                    <input type="password" class="form-control" id="deletePassword" placeholder="Tu contraseña" required>
                                </div>

                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" id="confirmDelete" required>
                                    <label class="form-check-label" for="confirmDelete">
                                        Entiendo que esta acción no se puede deshacer
                                    </label>
                                </div>

                                <button type="submit" class="btn btn-danger">
                                    <i class="fas fa-trash me-2"></i>Eliminar Mi Cuenta
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="api.js"></script>
    <script>
        // Verificar autenticación
        document.addEventListener('DOMContentLoaded', function() {
            if (!isUserLoggedIn()) {
                window.location.href = 'inicio_sesion.html';
                return;
            }
            
            loadUserProfile();
            setupEventListeners();
        });

        function loadUserProfile() {
            const user = getCurrentUserData();
            if (user) {
                document.getElementById('userName').textContent = user.full_name || user.username;
                document.getElementById('userEmail').textContent = user.email;
                document.getElementById('userRole').textContent = user.role === 'admin' ? 'Administrador' : 'Usuario';
                
                document.getElementById('fullName').value = user.full_name || '';
                document.getElementById('userEmailDisplay').value = user.email;
                document.getElementById('userRoleDisplay').value = user.role === 'admin' ? 'Administrador' : 'Usuario';
                
                const joinDate = new Date(user.created_at || new Date());
                document.getElementById('joinDate').value = joinDate.toLocaleDateString('es-ES');
            }
        }

        function setupEventListeners() {
            document.getElementById('logoutBtn').addEventListener('click', function() {
                logout();
            });

            document.getElementById('profileForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                try {
                    const fullName = document.getElementById('fullName').value;
                    await updateProfile(fullName);
                    
                    // Actualizar datos en localStorage
                    const user = getCurrentUserData();
                    user.full_name = fullName;
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    
                    showNotification('Perfil actualizado correctamente', 'success');
                    loadUserProfile();
                } catch (error) {
                    showNotification(error.message, 'error');
                }
            });

            document.getElementById('passwordForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const oldPassword = document.getElementById('oldPassword').value;
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (newPassword !== confirmPassword) {
                    showNotification('Las contraseñas no coinciden', 'error');
                    return;
                }

                try {
                    await changePassword(oldPassword, newPassword);
                    showNotification('Contraseña cambiada correctamente', 'success');
                    document.getElementById('passwordForm').reset();
                } catch (error) {
                    showNotification(error.message, 'error');
                }
            });

            document.getElementById('deleteForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const password = document.getElementById('deletePassword').value;
                
                if (!confirm('¿Estás seguro de que deseas eliminar tu cuenta? Esta acción no se puede deshacer.')) {
                    return;
                }

                try {
                    await deleteAccount(password);
                    showNotification('Cuenta eliminada correctamente', 'success');
                    
                    setTimeout(() => {
                        logout();
                    }, 1000);
                } catch (error) {
                    showNotification(error.message, 'error');
                }
            });
        }

        function showSection(section, e) {
            if (e) e.preventDefault();
            
            // Ocultar todas las secciones
            document.querySelectorAll('.content-section').forEach(el => {
                el.classList.add('d-none');
            });
            
            // Mostrar la sección seleccionada
            document.getElementById(section + '-section').classList.remove('d-none');
            
            // Actualizar nav activo
            document.querySelectorAll('.sidebar-nav a').forEach(a => {
                a.classList.remove('active');
            });
            event.target.closest('a').classList.add('active');
        }

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `custom-notification ${type === 'error' ? 'error' : (type === 'info' ? 'info' : '')}`;
            notification.innerHTML = `
                <i class="fas ${type === 'error' ? 'fa-exclamation-circle' : (type === 'info' ? 'fa-info-circle' : 'fa-check-circle')}"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 4000);
        }
    </script>
</body>
</html>
